name: Build Mac Binary v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller --onefile --name "fund-server" \
            --distpath dist \
            --workpath .build-tmp \
            fund-server.py

      - name: Ad-hoc code sign (bypass Gatekeeper)
        run: |
          codesign --force --deep --sign - dist/fund-server
          echo "Code signing complete"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fund-server-mac-v2
          path: dist/fund-server
